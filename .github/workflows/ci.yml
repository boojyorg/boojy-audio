name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Keep in sync with ui/.fvmrc (the local FVM pin).
  FLUTTER_VERSION: '3.44.0'

# Cancel an in-progress run when a newer commit is pushed to the same PR/branch,
# so superseded runs stop burning a runner instead of finishing pointlessly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: cd ui && flutter pub get

      # Without this the engine cold-compiles every run (~minutes). Mirrors the
      # cache in the rust-checks job.
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build native engine (integration tests)
        run: cd engine && cargo build

      - name: Check formatting
        run: cd ui && dart format --set-exit-if-changed lib/ test/ integration_test/

      - name: Analyze
        run: cd ui && flutter analyze --fatal-infos

      - name: Run unit tests
        run: cd ui && flutter test

      # The macOS test host can't foreground on the headless runner
      # ("open returned 1"), so `flutter test -d macos` returns a non-zero exit
      # code regardless of the actual result — whether the app hangs (old 13-min
      # stall) or exits cleanly (BOOJY_CI=true makes the suite exit(0) once done,
      # which the tool then misreads as a crash). So we can't trust the exit code.
      #
      # Instead we judge success from the streamed test reporter: flutter prints
      # "<N> tests passed." only when every test passed, and "Some tests failed."
      # on any failure. A genuine failure therefore still fails the gate (no pass
      # marker / failure marker present) — only the bogus lifecycle exit code is
      # ignored. The retry remains as a net for the separate mid-suite stall flake
      # (a hang is killed at the timeout and re-run on a fresh attempt).
      - name: Run integration tests
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 5
          max_attempts: 3
          retry_on: any
          command: |
            cd ui
            set +e
            out=$(flutter test integration_test/ -d macos --dart-define=BOOJY_CI=true 2>&1)
            echo "$out"
            if echo "$out" | grep -qE "[0-9]+ tests? passed\." && ! echo "$out" | grep -q "Some tests failed"; then
              echo "Integration suite passed (flutter exit code ignored — known headless-foreground quirk)."
              exit 0
            fi
            echo "::error::Integration suite did not report success."
            exit 1

  flutter-checks-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: cd ui && flutter pub get

      - name: Analyze
        run: cd ui && flutter analyze --fatal-infos

      - name: Run unit tests
        run: cd ui && flutter test

  rust-checks-windows:
    runs-on: windows-latest
    # CMake builds the VST3 SDK from source (several minutes) — see below.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # Resolve the pinned VST3 SDK commit so the host-lib cache below busts
      # whenever the SDK changes — the same staleness guard the from-scratch
      # rebuild gives, just skipped on a hit.
      - name: Resolve VST3 SDK commit
        id: vst3
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD:engine/vst3sdk)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'

      # The committed engine/lib/*.lib go stale (built only on a Mac dev box),
      # so Windows rebuilds the VST3 host libs from source via CMake — several
      # minutes, the long pole of this job. Cache just the built .lib outputs
      # (all cargo needs to link) in a dir OUTSIDE the git-tracked build_win,
      # keyed on the SDK commit + our vst3_host sources: a hit skips CMake
      # entirely, a miss does the full clean rebuild and repopulates the cache.
      # Bump the -v1- token to force a rebuild if a toolchain change ever makes
      # the cached libs incompatible.
      - name: Cache VST3 host libraries
        id: vst3-cache
        uses: actions/cache@v4
        with:
          path: vst3-libs-cache
          key: vst3-host-libs-win-v1-${{ steps.vst3.outputs.sha }}-${{ hashFiles('engine/vst3_host/CMakeLists.txt', 'engine/vst3_host/vst3_host.cpp', 'engine/vst3_host/vst3_host.h', 'engine/vst3_host/vst3_host_win.cpp') }}

      - name: Build VST3 host libraries
        if: steps.vst3-cache.outputs.cache-hit != 'true'
        run: |
          cd engine\vst3_host
          if (Test-Path build_win) { Remove-Item -Recurse -Force build_win }
          mkdir build_win
          cd build_win
          cmake -G "Visual Studio 17 2022" -A x64 ..
          cmake --build . --config Release
          # Stash the rebuilt libraries in the cache dir at the repo root.
          New-Item -ItemType Directory -Force -Path ..\..\..\vst3-libs-cache | Out-Null
          Copy-Item -Path "lib\Release\*.lib" -Destination ..\..\..\vst3-libs-cache\ -Force

      # Install the freshly built OR cache-restored libs where cargo links them.
      - name: Install VST3 host libraries
        run: Copy-Item -Path "vst3-libs-cache\*.lib" -Destination "engine\lib\" -Force

      - name: Clippy
        run: cd engine && cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cd engine && cargo test

  rust-checks:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Clippy
        run: cd engine && cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cd engine && cargo test
