name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Keep in sync with ui/.fvmrc (the local FVM pin).
  FLUTTER_VERSION: '3.44.0'

jobs:
  flutter-checks:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: cd ui && flutter pub get

      - name: Build native engine (integration tests)
        run: cd engine && cargo build

      - name: Check formatting
        run: cd ui && dart format --set-exit-if-changed lib/ test/ integration_test/

      - name: Analyze
        run: cd ui && flutter analyze --fatal-infos

      - name: Run unit tests
        run: cd ui && flutter test

      - name: Run integration tests
        run: cd ui && flutter test integration_test/ -d macos

  flutter-checks-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: cd ui && flutter pub get

      - name: Analyze
        run: cd ui && flutter analyze --fatal-infos

      - name: Run unit tests
        run: cd ui && flutter test

  rust-checks-windows:
    runs-on: windows-latest
    # CMake builds the VST3 SDK from source (several minutes) — see below.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # The committed engine/lib/*.lib go stale (built only on a Mac dev box).
      # Build them fresh from source so cargo test links — mirrors release.yml.
      - name: Build VST3 host libraries
        run: |
          cd engine\vst3_host
          if (Test-Path build_win) { Remove-Item -Recurse -Force build_win }
          mkdir build_win
          cd build_win
          cmake -G "Visual Studio 17 2022" -A x64 ..
          cmake --build . --config Release
          # Copy all rebuilt libraries to engine/lib/ (overwrite stale pre-built ones)
          Copy-Item -Path "lib\Release\*.lib" -Destination "..\..\lib\" -Force

      - name: Clippy
        run: cd engine && cargo clippy --all-targets

      - name: Run tests
        run: cd engine && cargo test

  rust-checks:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Clippy
        run: cd engine && cargo clippy --all-targets

      - name: Run tests
        run: cd engine && cargo test
