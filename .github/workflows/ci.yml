name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # Keep in sync with ui/.fvmrc (the local FVM pin).
  FLUTTER_VERSION: '3.44.0'

# Cancel an in-progress run when a newer commit is pushed to the same PR/branch,
# so superseded runs stop burning a runner instead of finishing pointlessly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: cd ui && flutter pub get

      # The native-engine tests (test/native/) load libengine over dart:ffi, so
      # the dylib must exist before `flutter test`. Cached so it doesn't
      # cold-compile every run (mirrors the rust-checks job).
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build native engine (for test/native ffi tests)
        run: cd engine && cargo build

      - name: Check formatting
        run: cd ui && dart format --set-exit-if-changed lib/ test/

      # EH-1: guard the Sparkle feed URL so a rename never silently breaks
      # auto-update. The URL must match the appcast push target in release.yml.
      - name: Assert SUFeedURL in Info.plist
        run: |
          grep -q 'https://raw.githubusercontent.com/boojyorg/boojy-audio/master/appcast.xml' \
            ui/macos/Runner/Info.plist || \
            { echo "SUFeedURL mismatch in ui/macos/Runner/Info.plist"; exit 1; }

      - name: Analyze
        run: cd ui && flutter analyze --fatal-infos

      # The native-engine golden-path tests now run here as plain unit tests
      # (test/native/), not as on-device `integration_test -d macos` — so the old
      # headless-foreground hang, reporter-grep success check, and 3x retry are
      # gone. BOOJY_CI=true makes test/native fail loudly (not skip) if the dylib
      # is missing, so a forgotten build can't produce a vacuous green suite (C92).
      - name: Run unit tests
        run: cd ui && flutter test --dart-define=BOOJY_CI=true

  flutter-checks-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: cd ui && flutter pub get

      - name: Analyze
        run: cd ui && flutter analyze --fatal-infos

      - name: Run unit tests
        run: cd ui && flutter test

  rust-checks-windows:
    runs-on: windows-latest
    # CMake builds the VST3 SDK from source (several minutes) — see below.
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # Resolve the pinned VST3 SDK commit so the host-lib cache below busts
      # whenever the SDK changes — the same staleness guard the from-scratch
      # rebuild gives, just skipped on a hit.
      - name: Resolve VST3 SDK commit
        id: vst3
        shell: pwsh
        run: '"sha=$(git rev-parse HEAD:engine/vst3sdk)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'

      # The committed engine/lib/*.lib go stale (built only on a Mac dev box),
      # so Windows rebuilds the VST3 host libs from source via CMake — several
      # minutes, the long pole of this job. Cache just the built .lib outputs
      # (all cargo needs to link) in a dir OUTSIDE the git-tracked build_win,
      # keyed on the SDK commit + our vst3_host sources: a hit skips CMake
      # entirely, a miss does the full clean rebuild and repopulates the cache.
      # Bump the -v1- token to force a rebuild if a toolchain change ever makes
      # the cached libs incompatible.
      - name: Cache VST3 host libraries
        id: vst3-cache
        uses: actions/cache@v4
        with:
          path: vst3-libs-cache
          key: vst3-host-libs-win-v1-${{ steps.vst3.outputs.sha }}-${{ hashFiles('engine/vst3_host/CMakeLists.txt', 'engine/vst3_host/vst3_host.cpp', 'engine/vst3_host/vst3_host.h', 'engine/vst3_host/vst3_host_win.cpp') }}

      - name: Build VST3 host libraries
        if: steps.vst3-cache.outputs.cache-hit != 'true'
        run: |
          cd engine\vst3_host
          if (Test-Path build_win) { Remove-Item -Recurse -Force build_win }
          mkdir build_win
          cd build_win
          cmake -G "Visual Studio 17 2022" -A x64 ..
          cmake --build . --config Release
          # Stash the rebuilt libraries in the cache dir at the repo root.
          New-Item -ItemType Directory -Force -Path ..\..\..\vst3-libs-cache | Out-Null
          Copy-Item -Path "lib\Release\*.lib" -Destination ..\..\..\vst3-libs-cache\ -Force

      # Install the freshly built OR cache-restored libs where cargo links them.
      - name: Install VST3 host libraries
        run: Copy-Item -Path "vst3-libs-cache\*.lib" -Destination "engine\lib\" -Force

      - name: Clippy
        run: cd engine && cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cd engine && cargo test

  rust-checks:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # engine/rust-toolchain.toml pins the exact channel; specifying
          # @stable here still honours the file (dtolnay reads it) — the explicit
          # pin just makes the CI log unambiguous about which toolchain ran.
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      # EH-3a: reject un-formatted Rust before tests run.
      - name: Check Rust formatting
        run: cd engine && cargo fmt --all -- --check

      - name: Clippy
        run: cd engine && cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cd engine && cargo test
