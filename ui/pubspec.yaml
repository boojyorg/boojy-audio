name: boojy_audio
description: "Boojy Audio — a cross-platform digital audio workstation."
publish_to: 'none'

version: 0.6.0+10

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # FFI for Rust integration
  ffi: ^2.1.0

  # File handling
  desktop_drop: ^0.4.4
  cross_file: ^0.3.4+2
  file_picker: ^8.0.0+1

  # Preferences storage
  shared_preferences: ^2.2.2

  # Path provider for app directories
  path_provider: ^2.1.1

  # UUID generation for snapshots
  uuid: ^4.5.2

  # Path manipulation
  path: ^1.9.0

  # State management
  provider: ^6.1.2

  # Window management for desktop
  window_manager: ^0.4.3

  # App version info
  package_info_plus: ^8.0.0

  # SVG rendering for custom icons
  flutter_svg: ^2.0.10+1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Recommended lints; rules are configured in analysis_options.yaml.
  flutter_lints: ^5.0.0

  # Generates the macOS launcher appiconset from assets/images/app_icon_master.png.
  # Re-run after changing the master:
  #   fvm dart run flutter_launcher_icons
  # Windows is NOT generated here — the tool emits a single-size .ico that looks
  # fuzzy at taskbar/title-bar sizes. Regenerate windows/runner/resources/app_icon.ico
  # with ImageMagick instead:
  #   magick assets/images/app_icon_master.png -background none \
  #     -define icon:auto-resize=256,128,64,48,32,24,16 \
  #     windows/runner/resources/app_icon.ico
  flutter_launcher_icons: ^0.14.3
  analyzer: ^13.0.0

flutter_launcher_icons:
  image_path: "assets/images/app_icon_master.png"
  macos:
    generate: true
    image_path: "assets/images/app_icon_master.png"

flutter:

  uses-material-design: true

  # Assets for Boojy Audio
  assets:
    - assets/images/
    - assets/icons/
    # Bundled drum samples (CC0/in-house — see assets/samples/drums/LICENSES.md).
    # Copied out to app-support on first use; the engine loads by filesystem path.
    - assets/samples/drums/Kicks/
    - assets/samples/drums/Snares/
    - assets/samples/drums/Hats/
    - assets/samples/drums/Claps/
    - assets/samples/drums/Toms/
    - assets/samples/drums/Cymbals/

  # Bundled typefaces (SIL OFL — see assets/fonts/Inter-LICENSE.txt and
  # assets/fonts/JetBrainsMono-OFL.txt for attribution):
  #   Inter         — UI text; weights match BT (400/500/600) + 700 for bold headings
  #   JetBrainsMono — numeric readouts (transport LCD, tempo, position, time)
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
